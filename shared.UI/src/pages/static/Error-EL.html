<section class="content-card static-error-page" role="alert">

    <i class="bi bi-exclamation-triangle"></i>
  </div>

  <p>Το ManatOS δεν μπόρεσε να προετοιμάσει αυτή τη σελίδα.</p>

  <p><a href="/">Επιστροφή στην αρχική σελίδα</a></p>
</section>
