<!-- PopupCredentialsContent template: the credential-entry child placeholder; inputs remain owned by AuthCredentials. -->
<manatos-auth-credentials
  [mode]="item().mode"
  [fieldIds]="item().fieldIds"
  [tabId]="tabId()"
  [popup]="popup()"
  [language]="language()"
  [recoveryActionId]="item().recoveryActionId ?? null"
  [attr.data-popup-layout-id]="item().id"
  (passwordRecoveryRequested)="requestRecovery()($event)"
/>
