<!-- A real credential control: the parent provides field metadata, never input values. -->
<label class="form-label" [attr.data-popup-layout-id]="layoutId() + '-label'" [for]="inputId()">
  {{ multilingual().resolve(field().label) }}
</label>
@if (password()) {
<div class="password-visibility-field">
  <input
    #nativeInput
    class="form-control"
    [class.password-input]="fieldId() === 'password' && mode() === 'signin'"
    [id]="inputId()"
    [name]="fieldId()"
    [attr.data-popup-layout-id]="layoutId() + '-input'"
    [type]="nativeType()"
    [autocomplete]="fieldId() === 'currentPassword' ? 'current-password' : field().autocomplete"
    [required]="fieldId() === 'currentPassword' ? false : field().required"
    [attr.minlength]="fieldId() === 'currentPassword' ? null : (field().minLength ?? null)"
    (input)="onInput()"
  />
  <button
    type="button"
    class="password-visibility-toggle"
    [attr.aria-label]="visibilityLabel()"
    [attr.aria-pressed]="visible()"
    (click)="toggleVisibility()"
  >
    <i
      class="bi"
      [class.bi-eye]="!visible()"
      [class.bi-eye-slash]="visible()"
      aria-hidden="true"
    ></i>
  </button>
</div>
} @else {
<input
  #nativeInput
  class="form-control"
  [class.identity-input]="fieldId() === 'identity'"
  [id]="inputId()"
  [name]="fieldId()"
  [attr.data-popup-layout-id]="layoutId() + '-input'"
  [type]="nativeType()"
  [autocomplete]="field().autocomplete"
  [required]="field().required"
  [attr.minlength]="field().minLength ?? null"
  [attr.aria-describedby]="fieldId() === 'recoveryIdentity' ? 'ng1-password-reminder-feedback ng1-password-reminder-help' : null"
  (input)="onInput()"
/>
} @if (fieldId() === 'recoveryIdentity') {
<div
  class="invalid-feedback"
  id="ng1-password-reminder-feedback"
  [attr.data-popup-layout-id]="layoutId() + '-feedback'"
>
  {{ multilingual().resolve('@CM.AuthRecoveryInvalid') }}
</div>
<div
  class="form-text"
  id="ng1-password-reminder-help"
  [attr.data-popup-layout-id]="layoutId() + '-help'"
>
  {{ multilingual().resolve('@CM.AuthRecoveryPrivacy') }}
</div>
}
