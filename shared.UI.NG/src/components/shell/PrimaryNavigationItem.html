<div
  class="primary-navigation-dropdown"
  [class.primary-navigation-top-level]="depth() === 0"
  [class.primary-navigation-nested]="depth() > 0"
>
  @if (item().children.length) {
  <button
    type="button"
    class="primary-navigation-item"
    [title]="item().tooltip ?? item().label"
    [attr.aria-expanded]="depth() === 0 ? open() : null"
    (click)="depth() === 0 ? toggle($event) : $event.preventDefault()"
  >
    @if (item().icon) {
    <i [class]="'bi ' + item().icon" aria-hidden="true"></i>
    }

    <span>{{ item().label }}</span>

    <i
      [class]="
        depth() === 0
          ? 'bi bi-caret-down-fill navigation-caret'
          : 'bi bi-chevron-right submenu-caret'
      "
      aria-hidden="true"
    ></i>
  </button>

  <div
    [class]="
      depth() === 0
        ? 'primary-navigation-menu'
        : 'primary-navigation-submenu-menu'
    "
    [class.open]="depth() === 0 && open()"
  >
    @for (child of item().children; track child.id) {
    <manatos-primary-navigation-item
      [item]="child"
      [depth]="depth() + 1"
      (itemSelected)="selectChild($event)"
    />
    }
  </div>
  } @else {
  <button
    type="button"
    class="primary-navigation-item"
    [title]="item().tooltip ?? item().label"
    (click)="select($event)"
  >
    @if (item().icon) {
    <i [class]="'bi ' + item().icon" aria-hidden="true"></i>
    }

    <span>{{ item().label }}</span>
  </button>
  }
</div>
