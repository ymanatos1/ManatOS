<header class="header">
  <div class="brand-area">
    <a class="brand" href="/" [attr.aria-label]="multilingual().ManatOsHome">
      <img
        class="brand-logo brand-logo-darker"
        [src]="branding.headerLogo.darker.src"
        [alt]="branding.headerLogo.darker.alt"
      />
      <img
        class="brand-logo brand-logo-lighter"
        [src]="branding.headerLogo.lighter.src"
        [alt]="branding.headerLogo.lighter.alt"
      />
    </a>

    <manatos-header-status
      [language]="language()"
      [statusLabel]="statusLabel()"
      [versionLabel]="versionLabel()"
      [apiStatus]="apiStatus()"
      [apiFailureCount]="apiFailureCount()"
    />
  </div>

  <div class="actions">
    <ng-content />

    <div class="header-auth-actions">
      @if (!signedIn()) {
      <button
        type="button"
        class="header-auth-button header-sign-in"
        [title]="multilingual().resolve('@CM.SignIn')"
        [attr.aria-label]="multilingual().resolve('@CM.SignIn')"
        (click)="requestLogin()"
      >
        <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>
        {{ multilingual().resolve('@CM.SignIn') }}
      </button>

      <button
        type="button"
        class="header-auth-button header-sign-up"
        [title]="multilingual().resolve('@CM.CreateAccount')"
        [attr.aria-label]="multilingual().resolve('@CM.CreateAccount')"
        (click)="requestRegister()"
      >
        <i class="bi bi-person-plus" aria-hidden="true"></i>
        {{ multilingual().resolve('@CM.SignUp') }}
      </button>
      } @else {
      <button
        type="button"
        class="header-auth-button header-notifications-button"
        [title]="multilingual().resolve('@CM.Notifications')"
        [attr.aria-label]="multilingual().resolve('@CM.Notifications')"
        (click)="requestNotifications()"
      >
        <i class="bi bi-bell" aria-hidden="true"></i>
      </button>

      <button
        type="button"
        class="header-auth-button header-account-button"
        [title]="multilingual().resolve('@CM.OpenAccountMenu')"
        [attr.aria-label]="multilingual().resolve('@CM.OpenAccountMenu')"
        (click)="requestAccount($event)"
        [attr.aria-expanded]="accountOpen()"
        aria-haspopup="true"
      >
        @if (accountPhotoUrl() && !photoUnavailable()) {
        <img
          class="header-account-photo"
          [src]="accountPhotoUrl()!"
          alt=""
          (error)="photoFailed()"
        />
        } @else {
        <i class="bi bi-person-circle" aria-hidden="true"></i>
        } {{ multilingual().resolve('@CM.Account') }}
        <span class="header-account-caret" aria-hidden="true"></span>
      </button>

      @if (accountOpen()) {
      <div
        class="header-account-menu"
        role="group"
        [attr.aria-label]="multilingual().resolve('@CM.AccountMenu')"
        (click)="$event.stopPropagation()"
      >
        <div class="header-account-identity">
          <div class="header-account-person">
            @if (accountPhotoUrl() && !photoUnavailable()) {
            <img
              class="header-account-menu-photo"
              [src]="accountPhotoUrl()!"
              alt=""
              (error)="photoFailed()"
            />
            } @else {
            <i class="bi bi-person-circle header-account-menu-fallback" aria-hidden="true"></i>
            }
            <span class="header-account-name">{{ accountName() }}</span>
          </div>
          <span class="header-account-role">{{ accountRole() }}</span>
        </div>

        <div class="header-account-divider"></div>
        <button
          type="button"
          class="header-account-item"
          disabled
          [title]="multilingual().resolve('@CM.AccountPageUnavailable')"
        >
          <i class="bi bi-person-vcard" aria-hidden="true"></i>
          {{ multilingual().resolve('@CM.AccountDetails') }}
        </button>
        <button type="button" class="header-account-item" (click)="requestChangePassword()">
          <i class="bi bi-key" aria-hidden="true"></i>
          {{ multilingual().resolve('@CM.ChangePassword') }}
        </button>
        <div class="header-account-divider"></div>

        <button
          type="button"
          class="header-account-item header-account-signout"
          (click)="requestSignOut()"
        >
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          {{ multilingual().resolve('@CM.Logout') }}
        </button>
      </div>
      } }
    </div>
  </div>
</header>
