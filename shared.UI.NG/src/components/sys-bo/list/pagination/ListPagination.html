<!-- ListPagination template: page navigation actions and rows-per-page selection using the current List status. -->
<footer
  class="manatos-list-pagination"
  data-list-layout="ListPagination"
  [hidden]="(context.level()?.state?.list?.total ?? 0) < (context.level()?.state?.list?.pageSizeOptions?.[0] ?? 2)"
>
  <span data-list-page-indicator [hidden]="(context.level()?.state?.list?.totalPages ?? 0) <= 1">
    {{ context.language() === 'EL' ? 'Σελίδα' : 'Page' }} {{ context.level()?.state?.list?.page ?? 1
    }} {{ context.language() === 'EL' ? 'από' : 'of' }} {{ context.displayedTotalPages() }}
  </span>
  <span class="manatos-list-pagination-right">
    <nav
      data-list-pagination-nav
      [hidden]="(context.level()?.state?.list?.totalPages ?? 0) <= 1"
      [attr.aria-label]="context.language() === 'EL' ? 'Σελίδες αποτελεσμάτων' : 'Result pages'"
    >
      <div class="manatos-list-page-links">
        <button
          type="button"
          data-list-page-action="first"
          [attr.aria-label]="context.language() === 'EL' ? 'Πρώτη σελίδα' : 'First page'"
          [attr.title]="context.language() === 'EL' ? 'Πρώτη σελίδα' : 'First page'"
          [disabled]="(context.level()?.state?.list?.loading ?? false) || (context.level()?.state?.list?.page ?? 1) <= 1"
          (click)="context.dispatchAction('list-pagination', 'first')"
        >
          <i class="bi bi-chevron-bar-left" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-list-page-action="previous"
          [attr.aria-label]="context.language() === 'EL' ? 'Προηγούμενη σελίδα' : 'Previous page'"
          [attr.title]="context.language() === 'EL' ? 'Προηγούμενη σελίδα' : 'Previous page'"
          [disabled]="(context.level()?.state?.list?.loading ?? false) || (context.level()?.state?.list?.page ?? 1) <= 1"
          (click)="context.dispatchAction('list-pagination', 'previous')"
        >
          <i class="bi bi-chevron-left" aria-hidden="true"></i>
        </button>
        <span class="manatos-list-page-current" aria-current="page"
          >{{context.level()?.state?.list?.page ?? 1}}</span
        >
        <button
          type="button"
          data-list-page-action="next"
          [attr.aria-label]="context.language() === 'EL' ? 'Επόμενη σελίδα' : 'Next page'"
          [attr.title]="context.language() === 'EL' ? 'Επόμενη σελίδα' : 'Next page'"
          [disabled]="(context.level()?.state?.list?.loading ?? false) || (context.level()?.state?.list?.page ?? 1) >= (context.level()?.state?.list?.totalPages ?? 0)"
          (click)="context.dispatchAction('list-pagination', 'next')"
        >
          <i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
        <button
          type="button"
          data-list-page-action="last"
          [attr.aria-label]="context.language() === 'EL' ? 'Τελευταία σελίδα' : 'Last page'"
          [attr.title]="context.language() === 'EL' ? 'Τελευταία σελίδα' : 'Last page'"
          [disabled]="(context.level()?.state?.list?.loading ?? false) || (context.level()?.state?.list?.page ?? 1) >= (context.level()?.state?.list?.totalPages ?? 0)"
          (click)="context.dispatchAction('list-pagination', 'last')"
        >
          <i class="bi bi-chevron-bar-right" aria-hidden="true"></i>
        </button>
      </div>
    </nav>
    <label
      >{{ context.language() === 'EL' ? 'Σειρές' : 'Rows' }}
      <select
        [attr.aria-label]="context.language() === 'EL' ? 'Γραμμές ανά σελίδα' : 'Rows per page'"
        data-list-rows-per-page
        [value]="context.level()?.state?.list?.pageSize ?? 10"
        (change)="onPageSize($event)"
      >
        @for (size of context.level()?.state?.list?.pageSizeOptions ?? [2,5,10,20,50,100]; track
        size) {
        <option [value]="size" [selected]="size === (context.level()?.state?.list?.pageSize ?? 10)">
          {{ size }}
        </option>
        }
      </select>
    </label>
  </span>
</footer>
