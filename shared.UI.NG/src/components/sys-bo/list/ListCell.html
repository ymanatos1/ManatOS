<!-- ListCell template: one column value within a specific indexed row; the field formatter supplies the value markup. -->
<div
  class="manatos-list-cell"
  role="cell"
  data-list-layout="ListCell"
  [attr.data-list-cell-index]="cellIndex()"
>
  @if (embeddedRow() !== null && field() === relatedViewField) {
  <span data-list-cell-value>
    <button type="button" class="manatos-list-btn" data-entry-related-view-row>
      {{ embeddedLanguage() === 'EL' ? 'Προβολή' : 'View' }}
    </button>
  </span>
  } @else {
  <span data-list-cell-value [innerHTML]="html()"></span>
  }
</div>
