<!-- ListColumnsRow template: the view-dependent ColumnHeader child instances and their stable column indices. -->
<div class="manatos-list-table-heading" role="row" data-list-layout="ListColumnsRow">
  @for (column of embeddedColumns() ?? context?.columns() ?? []; track column.field; let columnIndex
  = $index) {
  <manatos-list-column-header
    [caption]="column.caption"
    [index]="columnIndex"
    [field]="column.field"
    [sortable]="column.sortable ?? false"
  />
  }
</div>
