<!-- VersionField: Major/minor/patch display parts without invented partial-version commits. -->
<manatos-field-control-shell [field]="field()">
  <span class="manatos-form-leading"><span aria-hidden="true">v</span></span>
  <div
    data-entry-control
    class="manatos-form-parts manatos-form-version"
    [attr.aria-label]="field().label"
  >
    <input
      data-version-part="major"
      class="manatos-form-part"
      type="number"
      min="0"
      [value]="parts().major"
      readonly
      aria-label="Major"
    /><span>.</span
    ><input
      data-version-part="minor"
      class="manatos-form-part"
      type="number"
      min="0"
      [value]="parts().minor"
      readonly
      aria-label="Minor"
    /><span>.</span
    ><input
      data-version-part="patch"
      class="manatos-form-part"
      type="number"
      min="0"
      [value]="parts().patch"
      readonly
      aria-label="Patch"
    />
  </div>
</manatos-field-control-shell>
