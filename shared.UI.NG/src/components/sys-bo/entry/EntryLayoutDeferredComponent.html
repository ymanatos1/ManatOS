<!-- EntryLayoutDeferredComponent template: one unavailable layout slot without pretending to support the missing editor. -->
<div
  class="manatos-entry-deferred"
  [attr.data-entry-layout-id]="item().layoutId"
  [style.grid-column]="'span ' + item().span"
>
  <span data-entry-deferred>{{ item().reference }}</span>
  <small
    >{{ entry.language() === 'EL' ? 'Δεν έχει μεταφερθεί ακόμη' : 'Not yet available in this editor'
    }}</small
  >
</div>
