@if (wizard(); as state) {
<div class="storage-tab-body" data-popup-layout-id="storage-files">
  @if (state.stepById('files'); as step) {
  <manatos-storage-tab-status [wizard]="state" [popup]="popup()" [step]="step" />
  <manatos-storage-metadata-fields [wizard]="wizard()" [step]="step" />
  <manatos-storage-tab-status [wizard]="state" [popup]="popup()" [step]="step" [footer]="true" />
  }
</div>
}
