<!-- Native PictureEditor owns toolbar, canvas and zoom presentation. -->
<div class="ejs-picture-editor-canvas-composite" data-picture-editor>
  <div class="ejs-picture-toolbar" role="toolbar">
    <button type="button" data-picture-tool="move" class="active" disabled>
      <i class="bi bi-arrows-move"></i> <span data-picture-move-text>Move</span>
    </button>
    <button type="button" data-picture-tool="crop" disabled>
      <i class="bi bi-crop"></i> <span data-picture-crop-text>Crop area</span>
    </button>
    <button type="button" data-picture-cropmode="proportional" disabled>Proportional</button>
    <button type="button" data-picture-cropmode="free" disabled>Free</button>
  </div>
  <canvas
    width="__UIS_CanvasWidth__"
    height="__UIS_CanvasHeight__"
    data-picture-canvas
    role="img"
    aria-label="Picture crop preview"
  ></canvas>
  <p class="ejs-picture-help" data-picture-help></p>
  <label class="ejs-picture-zoom"
    ><i class="bi bi-image" aria-hidden="true"></i
    ><input
      type="range"
      min="1"
      max="3"
      step="0.01"
      value="1"
      data-picture-zoom
      disabled
      aria-label="Picture zoom" /><i class="bi bi-zoom-in" aria-hidden="true"></i
  ></label>
  <p class="ejs-picture-error" data-picture-error role="alert" hidden></p>
</div>
