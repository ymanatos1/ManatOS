<!-- Typed Field owns its reusable FieldTools child, when supported. -->
<span data-entry-field-tools-slot></span>
<!-- DurationField template: duration editor and its amount/unit parts. -->
<div data-entry-control class="manatos-form-parts">
  <label
    >Years<input
      class="manatos-form-part"
      type="number"
      min="0"
      step="1"
      data-duration-part="years" /></label
  ><label
    >Months<input
      class="manatos-form-part"
      type="number"
      min="0"
      step="1"
      data-duration-part="months" /></label
  ><label
    >Days<input class="manatos-form-part" type="number" min="0" step="1" data-duration-part="days"
  /></label>
</div>
