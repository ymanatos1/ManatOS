<!-- Sortable ListColumnHeader: caption, keyboard focus, action selector and sort icon belong to this concrete template. -->
<div
  class="manatos-list-column-title"
  role="columnheader"
  data-list-sort-field="__UIS_SortField__"
  tabindex="0"
  data-list-layout="ListColumnHeader"
  data-list-column-index="__UIS_Index__"
>
  <span data-list-column-caption>__UIS_Caption__</span>
  <i class="bi bi-arrow-down-up manatos-list-sort-icon" aria-hidden="true" data-list-sort-icon></i>
</div>
