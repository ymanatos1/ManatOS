<!-- List template: the header, columns, keyed rows, pagination and optional actions; only row children are replaced when record identities change. -->
<section class="manatos-list" data-list data-list-layout="List">
  <!-- UIS:Header -->
  <div data-list-status role="status" hidden></div>
  <div class="manatos-list-table" role="table" aria-label="" data-list-table>
    <div data-list-table-heading data-list-child-slot="ListColumnsRow"></div>
    <div class="manatos-list-rows" role="rowgroup" data-list-child-slot="ListRow"></div>
  </div>
  <!-- UIS:Pagination -->
</section>
