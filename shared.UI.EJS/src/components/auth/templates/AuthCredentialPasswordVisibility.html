<!-- Sensitive credential field owns its visibility action; preserve the same native input node when toggling. -->
<div class="password-visibility-field">
  <!-- UIS:Input --><button
    type="button"
    class="password-visibility-toggle"
    data-ejs-password-visibility="__UIS_Field__"
  >
    <i class="bi" aria-hidden="true"></i>
  </button>
</div>
