<!-- AuthEmailMethod template: email method action and description; no credential input belongs here. -->
<button
  type="button"
  class="auth-email-registration-button"
  data-ejs-method="__UIS_Id__"
  data-popup-layout-id="__UIS_Id__"
>
  <span class="auth-email-registration-icon"
    ><i class="bi bi-envelope" aria-hidden="true"></i
  ></span>
  <span class="auth-email-registration-copy"
    ><strong data-ejs-method-label="__UIS_Id__">__UIS_Label__</strong
    ><small data-ejs-method-description="__UIS_Id__">__UIS_Description__</small></span
  >
  <i class="bi bi-chevron-right auth-provider-chevron" aria-hidden="true"></i>
</button>
